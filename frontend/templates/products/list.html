<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>产品管理</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <script defer src="/assets/app.js"></script>
    <script defer src="/assets/products.js"></script>
  </head>
  <body class="page-products">
    <header class="topbar">
      <div class="inner">
        <a class="brand" href="/"><span class="dot"></span><span>产品管理</span></a>
        <nav class="nav">
          <div class="pill" th:if="${#authorization.expression('isAuthenticated()')}">
            <span class="spark"></span><span th:text="'当前用户：' + ${username}">当前用户</span>
          </div>
          <form method="post" action="/logout" th:if="${#authorization.expression('isAuthenticated()')}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button class="btn" type="submit">退出</button>
          </form>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="card pad compact">
        <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:10px; flex-wrap:wrap">
          <div>
            <h1 class="h1" style="margin-top:8px">产品列表</h1>
            <p class="sub">支持名称模糊查询 + 价格区间，多条件组合，分页展示。</p>
          </div>
          <div th:if="${#authorization.expression('hasRole(''ADMIN'')')}" class="pill">
            <span class="spark"></span><span>管理员可增删改</span>
          </div>
        </div>

        <form method="get" action="/products" class="searchbar" style="margin-top:8px">
          <div class="field inline">
            <div class="label">名称（模糊）</div>
            <input class="input sm w-280" name="name" placeholder="例如：Pro" th:value="${q.name}" />
          </div>

          <div class="field inline">
            <div class="label">价格区间</div>
            <div class="price-group">
              <input class="input sm w-120" name="minPrice" inputmode="decimal" placeholder="最小价" th:value="${minPriceRaw}" th:classappend="${priceError} ? ' invalid' : ''" />
              <input class="input sm w-120" name="maxPrice" inputmode="decimal" placeholder="最大价" th:value="${maxPriceRaw}" th:classappend="${priceError} ? ' invalid' : ''" />
            </div>
            <div class="err-inline" data-role="price-error" th:if="${priceError}" th:text="${priceError}">价格区间错误</div>
          </div>

          <div class="actions">
            <button class="btn primary" type="submit">查询</button>
            <a class="btn" href="/products">重置</a>
            <a class="btn primary" th:if="${#authorization.expression('hasRole(''ADMIN'')')}" href="/products/new">新增产品</a>
          </div>
        </form>
      </section>

      <section class="card pad table-card fixed">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th class="col-id">ID</th>
                <th class="col-name">名称</th>
                <th class="col-price">价格</th>
                <th class="col-stock">库存</th>
                <th class="col-status">状态</th>
                <th class="col-updated">更新时间</th>
                <th class="col-actions">操作</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${page.records}">
                <td class="col-id" th:text="${p.id}">1</td>
                <td class="col-name">
                  <div class="cell-name">
                    <a class="label link" th:href="@{'/products/' + ${p.id}}" th:text="${p.name}">Name</a>
                    <div class="hint" th:text="${p.description}">Desc</div>
                  </div>
                </td>
                <td class="col-price" th:text="${p.price}">0</td>
                <td class="col-stock" th:text="${p.stock}">0</td>
                <td class="col-status">
                  <span class="pill"><span class="spark"></span><span th:text="${p.status == 'ACTIVE' ? '启用' : (p.status == 'INACTIVE' ? '停用' : p.status)}">启用</span></span>
                </td>
                <td class="col-updated" th:text="${#temporals.format(p.updatedAt, 'yyyy-MM-dd HH:mm')}">time</td>
                <td class="col-actions">
                  <div style="display:flex; gap:8px; flex-wrap:wrap">
                    <a class="btn" th:href="@{'/products/' + ${p.id}}">详情</a>
                    <a class="btn" th:href="@{'/products/' + ${p.id} + '/edit'}" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">编辑</a>
                    <form method="post" th:action="@{'/products/' + ${p.id} + '/delete'}" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                      <button class="btn danger" type="submit" data-confirm="确定删除该产品吗？">删除</button>
                    </form>
                  </div>
                </td>
              </tr>
              <tr th:if="${page.total == 0}">
                <td colspan="7" class="hint">暂无数据，尝试调整查询条件。</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap">
          <div class="hint" th:text="'共 ' + ${page.total} + ' 条，当前第 ' + (${page.current}) + ' / ' + ${page.pages} + ' 页'">分页</div>
          <div style="display:flex; gap:8px; flex-wrap:wrap">
            <a class="btn" th:href="@{/products(name=${q.name},minPrice=${q.minPrice},maxPrice=${q.maxPrice},page=1)}">首页</a>
            <a class="btn" th:if="${page.current > 1}" th:href="@{/products(name=${q.name},minPrice=${q.minPrice},maxPrice=${q.maxPrice},page=${page.current - 1})}">上一页</a>
            <a class="btn" th:if="${page.current < page.pages}" th:href="@{/products(name=${q.name},minPrice=${q.minPrice},maxPrice=${q.maxPrice},page=${page.current + 1})}">下一页</a>
            <a class="btn" th:href="@{/products(name=${q.name},minPrice=${q.minPrice},maxPrice=${q.maxPrice},page=${page.pages})}">末页</a>
          </div>
        </div>
      </section>
    </main>

    <script th:if="${flashOk}" th:inline="javascript">
      window.AppToast && window.AppToast.ok([[${flashOk}]]);
    </script>
    <script th:if="${flashBad}" th:inline="javascript">
      window.AppToast && window.AppToast.bad([[${flashBad}]]);
    </script>
  </body>
</html>
