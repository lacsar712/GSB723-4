<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <script defer src="/assets/app.js"></script>
  </head>
  <body class="page-auth">
    <div class="container">
      <section class="card pad auth-card">
        <div class="pill"><span class="spark"></span><span>安全登录 · 角色权限 · 会话保护</span></div>
        <h1 class="h1" style="margin-top:12px">登录系统</h1>
        <p class="sub">使用 Spring Security 表单认证，支持 Remember-Me（1 天免登录）。</p>

        <form method="post" action="/login" class="grid auth-form">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

          <div class="field">
            <div class="label">用户名</div>
            <input class="input" name="username" autocomplete="username" placeholder="输入用户名" />
          </div>

          <div class="field">
            <div class="label">密码</div>
            <input class="input" type="password" name="password" autocomplete="current-password" placeholder="输入密码" />
          </div>

          <label class="pill auth-remember">
            <input type="checkbox" name="remember-me" />
            <span>记住我（1 天）</span>
          </label>

          <div class="auth-actions">
            <button class="btn primary" type="submit">登录</button>
            <a class="btn" href="/register">注册账号</a>
          </div>

          <div class="hint" th:if="${param.error}">用户名或密码错误，请重试。</div>
          <div class="hint" th:if="${param.logout}">已退出登录。</div>
          <div class="hint" th:if="${param.registered}">注册成功，请登录。</div>
        </form>
      </section>
    </div>
  </body>
</html>
